name: Daily publish

# The daily refresh (#12; docs/publishing.md): fetch the sources, rebuild, review with all three layers, and open a PR
# that the job merges itself on `merge` or labels `needs-human`. It also keeps the run status (the `status` branch) and
# opens one issue per kind of trouble. It needs "Allow GitHub Actions to create and approve pull requests" enabled in
# Settings → Actions → General (the workflow token cannot open a PR without it).
on:
  schedule:
    # 09:17 UTC = 06:17 in Brasília (UTC−3; no daylight saving since 2019): the Brasília day has begun, so a deferred
    # change is promoted on its start date (ADR 0003), and Planalto's overnight updates are in.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: fetch, build and review, but push, open and merge nothing (the reports are the run's artifacts)"
        type: boolean
        default: false
      rebuild:
        description: "Rebuild even if no page moved (the divergence recheck sets it when it confirms a difference; #18)"
        type: boolean
        default: false

# One run at a time; a run that starts while another is going waits for it instead of cancelling it.
concurrency:
  group: daily-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # The PR targets main and starts from the checked-out commit: only main may run this.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the publish/daily and status branches, merge the PR
      pull-requests: write # open, edit, label and merge the PR
      issues: write # the failure and outage issues, and the labels the job uses
      actions: write # dispatch deploy.yml after a merge (a merge by the workflow token starts no push workflow)
    # No job-level secrets: the token and the API key reach only the steps below that need them, never the install
    # (third-party install scripts) or the job's own `pnpm verify` (scripts/publish.ts runs it without them).
    steps:
      # No token left in .git/config: git authenticates through gh (`gh auth setup-git`) inside the publish step only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm at the version package.json pins (packageManager), with no third-party action.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Review layer 3. Without the secret, every change the reviewer must see is blocked (needs-human), never passed.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AKOMA_REVIEW_MODEL: ${{ vars.AKOMA_REVIEW_MODEL }}
        # Both inputs are booleans: each expression yields a fixed flag or nothing, never text from outside.
        run: node scripts/publish.ts ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.rebuild && '--rebuild' || '' }}
      # The full change report (a PR body is cut at 65,536 characters) and the dry run's outputs.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: change-report
          path: out/
          if-no-files-found: ignore
      # The job reports its own failures (one open issue, commented on while failing). This step covers a failure
      # before or around it (checkout, install, a crash in reporting), with the same label as the dedupe key.
      - name: Report a failure the job did not report
        if: failure() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/failure-reported ]; then exit 0; fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh label create publish-failure --force --color b60205 --description "The daily publish job failed (one open issue at a time)"
          open=$(gh issue list --label publish-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again, before or outside the job's own reporting. Run: $run_url"
          else
            gh issue create --title "Daily publish job failed" --label publish-failure --body "The daily publish workflow failed before or outside the job's own reporting (setup, install, or the reporting itself). This issue stays open until a run succeeds. Run: $run_url"
          fi
