name: Probe Planalto access

on:
  # Manual only: the daily publish job (#12) took over the scheduled check of Planalto (ADR 0001).
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-planalto.mjs
      - .github/workflows/probe-planalto.yml

# Read-only: the probe only checks out the script and uploads its result as an artifact.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (Dependabot proposes the updates, .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/probe-planalto.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-result.json
