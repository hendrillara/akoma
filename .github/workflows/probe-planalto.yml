name: Probe Planalto access

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-planalto.mjs
      - .github/workflows/probe-planalto.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/probe-planalto.mjs
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: probe-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-result.json
