name: CI

on:
  push:
  pull_request:

# Read-only: CI checks out and tests, nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (Dependabot proposes the updates, .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm at the version package.json pins (packageManager), with no third-party action.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
